<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>F-5 plan and checklist</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--green:#1a7f4e;--green-bg:#e8f6ee;--red:#b3362a;--red-bg:#fbeceb;--amber:#a85f00;--amber-bg:#fff6e0;--blue:#1d5f91;--blue-bg:#eaf3fb;--grey:#5b6472;--grey-bg:#eef0f3;--border:#dfe3e8;--text:#141a22;--sub:#5b6472;--page:#f6f7f9;--card:#fff;--ink:#0f1b2d}
body{font-family:'Apple SD Gothic Neo','Noto Sans KR','Segoe UI',system-ui,sans-serif;background:var(--page);color:var(--text);line-height:1.65;font-size:16px}
#gate{position:fixed;inset:0;z-index:99;background:var(--ink);display:flex;align-items:center;justify-content:center;padding:16px}
#gate.hidden{display:none}
.gate-box{background:#1c2a40;border-radius:14px;padding:36px 30px;width:100%;max-width:360px;text-align:center}
.gate-box h2{color:#f1f5f9;font-size:1.1rem;margin-bottom:6px;border:0;padding:0}
.gate-box p{color:#9fb0c6;font-size:.85rem;margin-bottom:20px}
.gate-box input{width:100%;padding:12px;font-size:1rem;background:var(--ink);border:1px solid #37496a;border-radius:8px;color:#f1f5f9;text-align:center;margin-bottom:12px}
.gate-box button{width:100%;padding:12px;font-size:.95rem;font-weight:600;background:#2f6fd0;color:#fff;border:0;border-radius:8px;cursor:pointer}
#pwError{color:#ff9d94;font-size:.82rem;margin-top:10px;display:none}
header{background:var(--ink);color:#fff;padding:28px 16px 24px}
.wrap{max-width:920px;margin:0 auto}
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap}
h1{font-size:1.45rem;font-weight:700;letter-spacing:-.01em;line-height:1.3}
.subline{color:#9fb0c6;font-size:.88rem;margin-top:4px}
.lang{display:flex;border:1px solid #37496a;border-radius:8px;overflow:hidden;flex-shrink:0}
.lang button{background:transparent;color:#9fb0c6;border:0;padding:8px 14px;font-size:.88rem;font-weight:600;cursor:pointer}
.lang button.on{background:#2f6fd0;color:#fff}
.meta{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px;margin-top:18px}
.meta>div{background:rgba(255,255,255,.07);border-radius:8px;padding:10px 12px}
.meta .l{font-size:.72rem;color:#9fb0c6;letter-spacing:.04em}
.meta .v{font-size:.95rem;font-weight:600;margin-top:2px}
main{padding:22px 16px 60px}
nav.toc{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:22px}
nav.toc a{font-size:.85rem;color:var(--blue);background:var(--blue-bg);padding:5px 11px;border-radius:99px;text-decoration:none}
section{margin-bottom:34px}
h2{font-size:1.15rem;margin-bottom:10px;padding-bottom:6px;border-bottom:2px solid var(--border)}
h3{font-size:.98rem;margin:16px 0 6px}
p{margin-bottom:10px}
.card{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:16px 18px;margin-bottom:12px}
.key{border-left:4px solid var(--green);background:var(--green-bg)}
.warn{border-left:4px solid var(--amber);background:var(--amber-bg)}
.stop{border-left:4px solid var(--red);background:var(--red-bg)}
.tbl{overflow-x:auto;background:var(--card);border:1px solid var(--border);border-radius:10px;margin-bottom:12px}
table{width:100%;border-collapse:collapse;font-size:.9rem;min-width:620px}
th{background:#f1f3f6;text-align:left;padding:9px 12px;font-size:.78rem;color:var(--sub);border-bottom:1px solid var(--border)}
td{padding:9px 12px;border-bottom:1px solid var(--border);vertical-align:top}
tr:last-child td{border-bottom:0}
td.num{font-variant-numeric:tabular-nums;white-space:nowrap}
tr.pass td:last-child{color:var(--green);font-weight:700}
tr.fail td:last-child{color:var(--red);font-weight:700}
blockquote{background:#f1f3f6;border-radius:8px;padding:12px 14px;font-size:.9rem;margin:8px 0 10px;white-space:pre-line}
.src{font-size:.8rem;color:var(--sub)}
ul{padding-left:20px;margin-bottom:10px}
li{margin-bottom:5px}
.tl{border-left:3px solid var(--border);margin-left:6px;padding-left:16px}
.tl .step{position:relative;margin-bottom:16px}
.tl .step::before{content:'';position:absolute;left:-23.5px;top:7px;width:12px;height:12px;border-radius:50%;background:var(--blue);border:2px solid var(--page)}
.tl .step.red::before{background:var(--red)}
.tl .step.green::before{background:var(--green)}
.tl .when{font-weight:700;font-size:.92rem}
.todo{display:flex;gap:10px;align-items:flex-start;background:var(--card);border:1px solid var(--border);border-radius:8px;padding:11px 13px;margin-bottom:6px;cursor:pointer;font-size:.92rem}
.todo input{width:17px;height:17px;margin-top:3px;flex-shrink:0;accent-color:var(--green)}
.todo.done{opacity:.5}
.todo.done .tx{text-decoration:line-through}
.who{font-size:.72rem;font-weight:700;padding:2px 7px;border-radius:4px;background:var(--grey-bg);color:var(--grey);margin-left:6px;white-space:nowrap}
.doc{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:12px 14px;margin-bottom:8px;display:grid;grid-template-columns:38px 1fr auto;gap:10px;align-items:start}
.doc .n{font-size:.78rem;font-weight:700;color:var(--sub);text-align:right;padding-top:2px}
.doc .nm{font-weight:600;font-size:.93rem}
.doc .nt{font-size:.84rem;color:var(--sub);margin-top:3px}
.doc .act{display:flex;flex-direction:column;align-items:flex-end;gap:6px}
.badge{font-size:.72rem;font-weight:700;padding:4px 10px;border-radius:99px;white-space:nowrap}
.b-ready{background:var(--green-bg);color:var(--green)}.b-refresh{background:var(--red-bg);color:var(--red)}.b-redate{background:var(--amber-bg);color:var(--amber)}.b-missing{background:var(--grey-bg);color:var(--grey)}.b-exempt{background:var(--blue-bg);color:var(--blue)}.b-reserve{background:#efe9fb;color:#5b32b0}
.view{font-size:.74rem;font-weight:600;padding:3px 9px;border-radius:6px;background:#f1f3f6;color:#2b3645;text-decoration:none;border:1px solid var(--border)}
details{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:12px 16px;margin-bottom:8px}
summary{font-weight:600;cursor:pointer}
details ol{padding-left:20px;margin-top:8px}
footer{text-align:center;font-size:.78rem;color:var(--sub);margin-top:30px}
@media(max-width:560px){.doc{grid-template-columns:30px 1fr}.doc .act{grid-column:2;flex-direction:row;flex-wrap:wrap}h1{font-size:1.2rem}}
@media print{#gate,.lang,nav.toc{display:none}body{background:#fff}.card,.doc,.todo,.tbl,details{break-inside:avoid}details>*{display:block}}
</style>
</head>
<body>
<div id="gate"><div class="gate-box">
  <h2>F-5 비자 서류 포털</h2>
  <p>Visa document portal. Authorized access only.<br>비밀번호를 입력하세요</p>
  <input id="pwInput" type="password" placeholder="Password" autocomplete="current-password">
  <button onclick="checkPw()">Enter</button>
  <div id="pwError">비밀번호가 올바르지 않습니다 · Incorrect password</div>
</div></div>

<header><div class="wrap">
  <div class="top">
    <div><h1 id="title"></h1><div class="subline" id="subline"></div></div>
    <div class="lang"><button id="bEn" onclick="setLang('en')">English</button><button id="bKo" onclick="setLang('ko')">한국어</button></div>
  </div>
  <div class="meta" id="meta"></div>
</div></header>

<main><div class="wrap" id="app"></div></main>

<script>
const PASS_HASH='29fc4b73';
function simpleHash(s){let h=0;for(let i=0;i<s.length;i++){h=(Math.imul(31,h)+s.charCodeAt(i))|0}return(h>>>0).toString(16)}
function store(k,v){try{if(v===undefined)return localStorage.getItem(k);localStorage.setItem(k,v)}catch(e){return null}}
function checkPw(){const i=document.getElementById('pwInput');if(simpleHash(i.value)===PASS_HASH){store('visa_pw_ok',Date.now().toString());document.getElementById('gate').classList.add('hidden')}else{document.getElementById('pwError').style.display='block';i.value='';i.focus()}}
document.getElementById('pwInput').addEventListener('keydown',e=>{if(e.key==='Enter')checkPw()});
(function(){const s=store('visa_pw_ok');if(location.protocol==='file:'||(s&&Date.now()-parseInt(s)<7*864e5))document.getElementById('gate').classList.add('hidden')})();
